
<style>
*{box-sizing:border-box;margin:0;padding:0;}
.app{display:flex;flex-direction:column;background:#fff;border:0.5px solid #e8e4f0;border-radius:16px;overflow:hidden;font-family:var(--font-sans);height:640px;}
.topbar{display:flex;align-items:center;padding:0 20px;height:52px;border-bottom:0.5px solid #eae6f4;background:#fff;gap:12px;flex-shrink:0;}
.logo-mark{width:28px;height:28px;position:relative;flex-shrink:0;}
.app-name{font-size:15px;font-weight:500;color:#3C3489;letter-spacing:-0.2px;}
.top-tabs{display:flex;gap:2px;margin-left:16px;}
.tab{font-size:12px;padding:4px 10px;border-radius:20px;color:#888;cursor:pointer;border:none;background:none;}
.tab.active{background:#EEEDFE;color:#534AB7;font-weight:500;}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.streak-badge{display:flex;align-items:center;gap:4px;background:#FFF0FA;border:0.5px solid #F4C0D1;border-radius:20px;padding:3px 10px;font-size:12px;color:#993556;}
.avatar{width:28px;height:28px;border-radius:50%;background:#c6e2f1;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:#185FA5;}
.main{display:flex;flex:1;overflow:hidden;}
.sidebar{width:52px;border-right:0.5px solid #eae6f4;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:8px;background:#fafafa;flex-shrink:0;}
.side-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#aaa;}
.side-icon.active{background:#EEEDFE;color:#534AB7;}
.side-icon svg{width:18px;height:18px;}
.calendar-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;border-right:0.5px solid #eae6f4;}
.cal-header{display:flex;align-items:center;padding:14px 20px 10px;gap:10px;flex-shrink:0;}
.cal-month{font-size:16px;font-weight:500;color:#3C3489;}
.cal-nav{display:flex;gap:2px;}
.nav-btn{width:26px;height:26px;border:0.5px solid #e0d8f0;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;color:#888;font-size:12px;}
.view-toggle{display:flex;gap:2px;margin-left:auto;background:#f3f0fa;border-radius:8px;padding:2px;}
.vt-btn{font-size:11px;padding:3px 8px;border-radius:6px;cursor:pointer;color:#888;border:none;background:none;}
.vt-btn.active{background:#fff;color:#534AB7;font-weight:500;}
.cal-grid{padding:0 16px 12px;flex:1;overflow:hidden;}
.day-labels{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
.day-label{text-align:center;font-size:11px;color:#bbb;padding:4px 0;font-weight:500;}
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.day-cell{border-radius:8px;padding:5px 6px;min-height:68px;cursor:pointer;position:relative;}
.day-cell:hover{background:#f8f5ff;}
.day-cell.other-month .day-num{color:#ddd;}
.day-cell.today .day-num{background:#534AB7;color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;}
.day-num{font-size:12px;color:#444;margin-bottom:3px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
.event-pill{font-size:10px;padding:2px 6px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pill-blue{background:#c6e2f1;color:#185FA5;}
.pill-pink{background:#F4C0D1;color:#993556;}
.pill-purple{background:#CECBF6;color:#3C3489;}
.pill-task{background:#E1F5EE;color:#085041;}
.chat-panel{width:256px;display:flex;flex-direction:column;flex-shrink:0;background:#fff;}
.chat-header{padding:14px 16px 10px;border-bottom:0.5px solid #eae6f4;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.unicorn-avatar{width:32px;height:32px;background:#EEEDFE;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.chat-title{font-size:13px;font-weight:500;color:#3C3489;}
.chat-sub{font-size:11px;color:#bbb;}
.chat-messages{flex:1;overflow-y:auto;padding:12px;}
.msg{margin-bottom:10px;}
.msg-ai{display:flex;gap:6px;align-items:flex-start;}
.msg-bubble-ai{background:#f3f0fa;border-radius:0 10px 10px 10px;padding:8px 10px;font-size:12px;color:#3C3489;line-height:1.5;max-width:188px;}
.msg-bubble-user{background:#534AB7;border-radius:10px 0 10px 10px;padding:8px 10px;font-size:12px;color:#EEEDFE;line-height:1.5;margin-left:auto;max-width:188px;}
.msg-ai-dot{width:20px;height:20px;background:#EEEDFE;border-radius:50%;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;}
.plan-card{background:#fff;border:0.5px solid #c6e2f1;border-radius:10px;padding:8px 10px;margin-top:6px;font-size:11px;}
.plan-row{display:flex;align-items:center;gap:6px;padding:3px 0;color:#444;}
.plan-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.plan-actions{display:flex;gap:6px;margin-top:8px;}
.plan-btn{flex:1;padding:5px;border-radius:8px;font-size:11px;text-align:center;cursor:pointer;border:0.5px solid;}
.plan-btn-confirm{background:#534AB7;color:#fff;border-color:#534AB7;}
.plan-btn-edit{background:#fff;color:#534AB7;border-color:#c6e2f1;}
.chat-input-area{padding:10px 12px;border-top:0.5px solid #eae6f4;flex-shrink:0;}
.chat-input-row{display:flex;align-items:center;gap:6px;background:#f8f5ff;border-radius:20px;padding:6px 10px 6px 14px;border:0.5px solid #e0d8f0;}
.chat-input-text{font-size:12px;color:#aaa;flex:1;}
.send-btn{width:24px;height:24px;border-radius:50%;background:#534AB7;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.conflict-banner{margin:6px 0;background:#FFF0FA;border:0.5px solid #F4C0D1;border-radius:8px;padding:7px 10px;font-size:11px;color:#993556;display:flex;gap:6px;align-items:flex-start;}
.warn-icon{flex-shrink:0;margin-top:1px;}
</style>

<script>
const days=[];
const eventMap={
  3:[{t:'项目汇报',cls:'pill-blue'}],
  7:[{t:'每日晨跑',cls:'pill-task'}],
  8:[{t:'斯德哥尔摩',cls:'pill-blue'},{t:'晨跑 30min',cls:'pill-task'}],
  9:[{t:'斯德哥尔摩',cls:'pill-blue'},{t:'线上会议',cls:'pill-purple'}],
  10:[{t:'斯德哥尔摩',cls:'pill-blue'},{t:'下午运动',cls:'pill-task'}],
  14:[{t:'竞品分析',cls:'pill-pink'}],
  15:[{t:'竞品分析',cls:'pill-pink'}],
  16:[{t:'团队站会',cls:'pill-purple'},{t:'竞品分析',cls:'pill-pink'}],
  21:[{t:'每日晨跑',cls:'pill-task'}],
  28:[{t:'月度复盘',cls:'pill-blue'}],
};
const grid=document.getElementById('cal');
const prefix=[0,1,2];
prefix.forEach(()=>{
  const d=document.createElement('div');
  d.className='day-cell other-month';
  d.innerHTML='<div class="day-num" style="color:#ddd;">'+(29+prefix.indexOf(prefix[prefix.length-1]))+'</div>';
  grid.appendChild(d);
});
const prevDays=[29,30,31];
prevDays.forEach((n,i)=>{
  const d=document.createElement('div');
  d.className='day-cell other-month';
  d.innerHTML='<div class="day-num" style="color:#ddd;">'+n+'</div>';
  grid.insertBefore(d,grid.children[i]);
});
grid.innerHTML='';
for(let i=1;i<=31;i++){
  const d=document.createElement('div');
  d.className='day-cell'+(i===15?' today':'');
  let html='<div class="day-num">'+i+'</div>';
  if(eventMap[i]) eventMap[i].forEach(e=>{html+='<div class="event-pill '+e.cls+'">'+e.t+'</div>';});
  d.innerHTML=html;
  grid.appendChild(d);
}
for(let i=1;i<=4;i++){
  const d=document.createElement('div');
  d.className='day-cell other-month';
  d.innerHTML='<div class="day-num" style="color:#ddd;">'+i+'</div>';
  grid.appendChild(d);
}
</script>
